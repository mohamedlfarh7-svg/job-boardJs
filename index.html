<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Stages &amp; Alternances</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">S&amp;A</span>
            <span class="brand-name">Portail Stages &amp; Alternances</span>
        </div>
        <nav class="top-nav">
            <a href="#" class="active">Offres</a>
            <a href="./offres-suivies.html">Suivies</a>
            <a href="./deposer-offre.html">Déposer</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-eyebrow">PROMOTION MERN 2026/2027</div>
        <h1>Trouvez votre stage ou alternance</h1>
        <p id="total-count-text">Chargement des offres...</p>
    </section>

    <div class="search-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Titre, entreprise, description...">
   
        <select id="type-select" class="filter-btn">
            <option value="">Tout type</option>
            <option value="Stage">Stage</option>
            <option value="Alternance">Alternance</option>
        </select>

        <select id="ville-select" class="filter-btn">
            <option value="">Toutes villes</option>
            <option value="Paris">Paris</option>
            <option value="Lyon">Lyon</option>
            <option value="Toulouse">Toulouse</option>
            <option value="Nantes">Nantes</option>
            <option value="Bordeaux">Bordeaux</option>
            <option value="Lille">Lille</option>
            <option value="Marseille">Marseille</option>
        </select>

        <select id="tech-select" class="filter-btn">
            <option value="">Toutes techs</option>
            <option value="React">React</option>
            <option value="PHP">PHP</option>
            <option value="Laravel">Laravel</option>
            <option value="Node.js">Node.js</option>
            <option value="JavaScript">JavaScript</option>
        </select>

        <span class="filter-btn count" id="count-badge">0 offres</span>
    </div>

    <main class="listings" id="listings"></main>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
